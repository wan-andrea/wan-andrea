name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          
          # "Large" display prevents cutoff
          config_display: large
          
          # Template: Classic is usually best for "Insights" look, 
          # but you can switch to 'terminal' if you still prefer dark mode.
          template: classic
          
          # Base sections (The standard stuff)
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          
          # --- The "Insights" Look (Badges & Gamification) ---
          
          # 1. Achievements (The Trophies/Badges)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes # Hides 'secret' achievements until unlocked
          plugin_achievements_threshold: C # Show achievements ranked C or higher
          
          # 2. Introduction (The "Title Card")
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # 3. Notable Contributions (The "Famous Projects" list)
          plugin_notable: yes
          plugin_notable_from: organization
          
          # --- Your Technical Stats (Languages & Calendar) ---
          
          # Indepth Language Analysis
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot, vue, jupyter notebook

          # Isometric Calendar (3D View)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Lines of Code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
